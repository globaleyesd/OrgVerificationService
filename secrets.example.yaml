# ============================================================================
# secrets.example.yaml  -  TEMPLATE ONLY, safe to commit.
#
# Copy to secrets.local.yaml and fill in real values:
#     cp secrets.example.yaml secrets.local.yaml
#
# secrets.local.yaml is git-ignored, docker-ignored, and never uploaded to any
# provider by the tooling. Admin values still set to CHANGE_ME make the app and
# the deploy scripts refuse to start.
# ============================================================================

# Used by deploy/ scripts from YOUR machine only. Prefer a least-privilege IAM
# user or short-lived SSO credentials. Never root keys.
# Leave both as "" to use your normal AWS CLI profile or environment instead.
aws:
  access_key_id: ""
  secret_access_key: ""
  session_token: ""            # Only for temporary credentials.
  profile: ""                  # Named AWS CLI profile (alternative to keys).

# Optional. Used only if llm.provider is "anthropic" (local runs: the AWS
# template uses "bedrock", so nothing secret has to be sent to AWS).
# Leave blank to run without AI: everything works except asking questions.
llm:
  api_key: ""

# Optional. First administrator account, created when sign-in is added.
# Leave blank to have one generated on first start.
admin:
  username: ""
  password: ""
