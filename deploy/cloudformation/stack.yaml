AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cheapest practical stack: one small ARM server running Docker (API + database), a private S3 bucket
  serving the web page through CloudFront, private S3 bucket for documents, a locked-down S3 bucket for password hashes, a tiny switch function that starts and stops the server, a power adapter the Control Center uses to take the project to zero and back, ECR for the image, optional
  budget alert and optional working-hours schedule. No NAT gateway, no load balancer, no managed database,
  no WAF, no CloudWatch agent (all deliberate COST decisions, listed in deploy/README.md).
  Nothing secret is stored in this template or sent to AWS by it.

Parameters:
  TemplateVersion:
    Type: String
    Default: unknown
    Description: The commit this template was deployed from (set by deploy/deploy.py). It makes every deploy a change, so CloudFormation always stores the new template; the power adapter reuses the stored one.
  ProjectName:
    Type: String
    Default: kb-verifier
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,28}$'
    Description: Neutral name used for tags and resource names.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      Amazon Linux 2023 ARM64 image. deploy/deploy.py looks it up once and then reuses it, so the server is
      never replaced just because a newer image was published (the database lives on its disk).
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.micro, t4g.small, t4g.medium]
    Description: COST - smallest ARM sizes only. t4g.small has 2 GiB memory.
  RootVolumeGb:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 200
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >
      AWS-managed prefix list of CloudFront origin-facing addresses. deploy/deploy.py looks it up with
      aws ec2 describe-managed-prefix-lists (name com.amazonaws.global.cloudfront.origin-facing).
  AllowBedrock:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Give the server permission to call Amazon Bedrock (needed when llm.provider is bedrock, so no API key is ever stored).
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: CloudFront sends it to the server as X-Origin-Verify; the server refuses requests without it, so nothing can reach it around this distribution. Generated once by deploy/deploy.py and kept in deploy/params.local.json.
  BudgetLimitUsd:
    Type: Number
    Default: 40
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional. Receives budget alerts. Leave empty to skip creating the budget.
  ScheduleEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: COST - stop the server outside working hours (Mon-Fri).
  ScheduleTimezone:
    Type: String
    Default: UTC
  StartHour:
    Type: Number
    Default: 8
    MinValue: 0
    MaxValue: 23
  StopHour:
    Type: Number
    Default: 18
    MinValue: 0
    MaxValue: 23
  Power:
    Type: String
    Default: 'on'
    AllowedValues: ['on', 'zero']
    Description: >
      Set by the Control Center's power adapter, not by hand. 'zero' removes the server, its disk and its Elastic IP
      (COST - nothing billed by the hour) and disables the site's distribution, so nothing at the site address
      answers; the database is backed up to the documents bucket first and restored when it comes back 'on'.
      Buckets, the page files and the image stay.

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]
  ScheduleOn: !Equals [!Ref ScheduleEnabled, 'true']
  BedrockOn: !Equals [!Ref AllowBedrock, 'true']
  IsUsEast1: !Equals [!Ref 'AWS::Region', 'us-east-1']
  PowerOn: !Equals [!Ref Power, 'on']
  ScheduleActive: !And [!Condition ScheduleOn, !Condition PowerOn]

Resources:
  # ------------------------------------------------------------------ network (all free of charge)
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc'}, {Key: Project, Value: !Ref ProjectName}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/26
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false          # the server gets one Elastic IP below, nothing else is public
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Only CloudFront may reach the server, on port 80. No SSH at all: use SSM Session Manager.
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web port from CloudFront only. No inbound SSH.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing addresses only
      Tags: [{Key: Project, Value: !Ref ProjectName}]

  # ------------------------------------------------------------------ storage
  # Web page bucket: fully private. Only the CloudFront distribution below can read it.
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 30}, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 3}}
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt UiBucket.Arn, !Sub '${UiBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: 's3:GetObject'
            Resource: !Sub '${UiBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Documents bucket (also holds the non-secret deploy files). Private, encrypted, versioned, kept if the stack is deleted.
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 30}, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 3}}
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}

  # Credentials bucket: holds ONLY salted password hashes (service switch, user accounts) and the key that signs sign-in
  # cookies. Private, encrypted, versioned, and readable/writable by the server's IAM role and nobody else.
  # Records are created on the server; the deploy script cannot upload to this bucket (it is not on its allow-list).
  # COST: a handful of tiny objects and a few requests a day, effectively free. SSE-S3 is used instead of a KMS key
  # (a customer key would add a monthly fee).
  CredsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 7}, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}}
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  CredsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CredsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt CredsBucket.Arn, !Sub '${CredsBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
          # Everyone except the server's role and the control function's role is refused, including administrators.
          # This is deliberate. To get in (break-glass) an administrator must first change this bucket policy, which
          # leaves a CloudTrail record. The control role's own IAM policy limits it to the two switch records.
          - Sid: OnlyTheServerRoleMayTouchRecords
            Effect: Deny
            Principal: '*'
            Action: ['s3:GetObject', 's3:GetObjectVersion', 's3:PutObject', 's3:DeleteObject', 's3:DeleteObjectVersion', 's3:ListBucket', 's3:ListBucketVersions']
            Resource: [!GetAtt CredsBucket.Arn, !Sub '${CredsBucket.Arn}/*']
            Condition:
              StringNotEquals:
                'aws:PrincipalArn': [!GetAtt ServerRole.Arn, !GetAtt ControlRole.Arn]

  # ------------------------------------------------------------------ web page + API entry point
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-ui-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          ContentSecurityPolicy:
            Override: true
            # Same policy as app/pages.py (a test keeps them identical). No inline scripts or styles are allowed.
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
        CustomHeadersConfig:
          Items:
            - {Header: Permissions-Policy, Value: 'microphone=(self), camera=(), geolocation=()', Override: true}
  # Clean page addresses: /ask -> ask.html, /add -> add.html (the same map as app/pages.py; a test checks it).
  # COST: CloudFront Functions are billed per request after a free allowance, a tiny amount at this scale.
  UrlRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Map /ask, /add, /review and /signin to their html files
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var pages = { '/ask': '/ask.html', '/add': '/add.html', '/review': '/review.html', '/signin': '/signin.html' };
          var uri = request.uri;
          if (uri.length > 1 && uri.charAt(uri.length - 1) === '/') {
            var bare = uri.slice(0, -1);
            if (pages[bare]) {
              return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: bare } } };
            }
          }
          if (pages[uri]) { request.uri = pages[uri]; }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: !If [PowerOn, true, false]   # at zero the site answers nothing at all; only the Control Center is reachable
        Comment: !Sub '${ProjectName} page and API'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: false                    # IPv4 reaches everyone; some networks cannot reach CloudFront over IPv6
        PriceClass: PriceClass_100            # COST - cheapest edge locations
        Origins:
          - Id: ui
            DomainName: !GetAtt UiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - !If
            - PowerOn
            - Id: api
              # Public DNS name of the Elastic IP (stable across stop/start).
              DomainName: !Sub
                - 'ec2-${Dashed}.${Suffix}'
                - Dashed: !Join ['-', !Split ['.', !Ref ServerIp]]
                  Suffix: !If [IsUsEast1, 'compute-1.amazonaws.com', !Sub '${AWS::Region}.compute.amazonaws.com']
              OriginCustomHeaders: [{HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginVerifySecret}]
              CustomOriginConfig:
                OriginProtocolPolicy: http-only   # see "Known gaps" in deploy/README.md: CloudFront to server is not encrypted
                HTTPPort: 80
                OriginReadTimeout: 60
            - !Ref 'AWS::NoValue'     # at zero there is no server: /api/* goes to the switch function, which answers "Service offline"
          - Id: control
            DomainName: !Select [2, !Split ['/', !GetAtt ControlUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ControlOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: !If [PowerOn, api, control]
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
          - PathPattern: /control/*
            TargetOriginId: control
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad        # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        # While the server is stopped the /api origin cannot be reached (502/504). Answer with the same JSON the app
        # itself uses for "Service offline", so the page and any direct caller get a clear message.
        CustomErrorResponses:
          - {ErrorCode: 502, ResponseCode: 503, ResponsePagePath: /offline.json, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ResponseCode: 503, ResponsePagePath: /offline.json, ErrorCachingMinTTL: 0}
      Tags: [{Key: Project, Value: !Ref ProjectName}]

  # ------------------------------------------------------------------ the server
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/project-role-boundary'   # see deploy/README.md
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
      Policies:
        - PolicyName: least-privilege-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ShipContainerLogs             # the Docker awslogs driver: this project's log group only
                Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams']
                Resource: [!GetAtt AppLogGroup.Arn, !Sub '${AppLogGroup.Arn}:log-stream:*']
              - Sid: CredentialsList
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !GetAtt CredsBucket.Arn
              - Sid: CredentialsReadWrite
                Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub '${CredsBucket.Arn}/*'
              - Sid: DataBucketList
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !GetAtt DataBucket.Arn
              - Sid: DataBucketObjects
                Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
                Resource: !Sub '${DataBucket.Arn}/*'
              - !If
                - BedrockOn
                - Sid: BedrockInvoke
                  Effect: Allow
                  Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream']
                  Resource: [!Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*', !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*']
                - !Ref 'AWS::NoValue'
  ServerProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ServerRole]
  Server:
    Type: AWS::EC2::Instance
    Condition: PowerOn
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref ServerSecurityGroup]
      IamInstanceProfile: !Ref ServerProfile
      Monitoring: false                       # COST - no detailed monitoring
      CreditSpecification: {CPUCredits: standard}   # COST - never pay for surplus CPU credits (may throttle under sustained load)
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 2}   # IMDSv2 only; hop limit 2 lets containers use the role
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: !Ref RootVolumeGb, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-server'}, {Key: Project, Value: !Ref ProjectName}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'EOF'
          { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
          EOF
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/app
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-aarch64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          echo "6e9fbd5daa20dca5d7d89145081ae8155d68ef2928b497d9f85b54fe0f9dbb2c  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -   # published checksum of v2.29.7
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          cat > /opt/app/update.sh <<'EOS'
          #!/bin/bash
          # Pulls the latest non-secret deploy files and image, then (re)starts the stack. Contains no secrets.
          set -euo pipefail
          cd /opt/app
          aws s3 cp s3://${DataBucket}/deploy/docker-compose.aws.yml ./docker-compose.aws.yml --region ${AWS::Region}
          aws s3 cp s3://${DataBucket}/deploy/config.yaml ./config.yaml --region ${AWS::Region}
          aws s3 cp s3://${DataBucket}/deploy/config.local.yaml ./config.local.yaml --region ${AWS::Region} 2>/dev/null || echo '{}' > ./config.local.yaml
          # The database password is created here, once, and never leaves this machine.
          [ -f db_password ] || { umask 077; head -c 32 /dev/urandom | base64 | tr -d '\n=' > db_password; }
          echo "IMAGE=kb-verifier-server:latest" > .env
          echo "CREDS_BUCKET=${CredsBucket}" >> .env
          echo "DATA_BUCKET=${DataBucket}" >> .env
          echo "AWS_REGION_NAME=${AWS::Region}" >> .env
          echo "ORIGIN_SECRET=${OriginVerifySecret}" >> .env
          chmod 600 .env
          # COST: the app image is a file in the documents bucket (no paid registry); the database image is public.
          aws s3 cp s3://${DataBucket}/image/server-image.tar.gz - --region ${AWS::Region} | gunzip | docker load
          docker compose -f docker-compose.aws.yml --env-file .env pull db
          # First start of a new server (for example coming back from zero): restore the latest database backup BEFORE
          # the app starts, so the app never creates empty tables first. Runs once per server.
          if [ ! -f .restored ]; then
            docker compose -f docker-compose.aws.yml --env-file .env up -d db
            for n in $(seq 1 30); do docker compose -f docker-compose.aws.yml --env-file .env exec -T db pg_isready -U app -d app && break; sleep 2; done
            if aws s3 ls s3://${DataBucket}/backups/db-latest.sql.gz --region ${AWS::Region} >/dev/null 2>&1; then
              aws s3 cp s3://${DataBucket}/backups/db-latest.sql.gz - --region ${AWS::Region} | gunzip | docker compose -f docker-compose.aws.yml --env-file .env exec -T db psql -q -U app -d app
            fi
            touch .restored
          fi
          docker compose -f docker-compose.aws.yml --env-file .env up -d --remove-orphans
          docker image prune -f
          EOS
          chmod +x /opt/app/update.sh
          cat > /opt/app/backup.sh <<'EOS'
          #!/bin/bash
          # Run by the power adapter before the project goes to zero. Dumps the database to the documents bucket.
          set -euo pipefail
          cd /opt/app
          # A Stop right after Turn on: wait for the first start to finish (it restores the last backup), and never back up
          # a server whose restore did not complete, so the good backup is never replaced by an empty database.
          cloud-init status --wait >/dev/null 2>&1 || true
          [ -f .restored ] || { echo "the first start has not finished"; exit 1; }
          for n in $(seq 1 60); do
            docker compose -f docker-compose.aws.yml --env-file .env exec -T db pg_isready -U app -d app >/dev/null 2>&1 && break
            sleep 5
          done
          f=/tmp/db-$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          docker compose -f docker-compose.aws.yml --env-file .env exec -T db pg_dump -U app -d app --clean --if-exists | gzip > "$f"
          [ -s "$f" ] || { echo "empty backup"; exit 1; }
          aws s3 cp "$f" s3://${DataBucket}/backups/$(basename "$f") --region ${AWS::Region}
          aws s3 cp "$f" s3://${DataBucket}/backups/db-latest.sql.gz --region ${AWS::Region}
          rm -f "$f"
          EOS
          chmod +x /opt/app/backup.sh
          /opt/app/update.sh || echo "Image not pushed yet. Push it, then run the update step."
  ServerIp:
    Type: AWS::EC2::EIP
    Condition: PowerOn
    Properties:
      Domain: vpc
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  ServerIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: PowerOn
    Properties:
      AllocationId: !GetAtt ServerIp.AllocationId
      InstanceId: !Ref Server

  # ------------------------------------------------------------------ status: what the page asks while the app may be down
  # A tiny function that reports the server's state and answers /api/* while the project is at zero. It can't start or
  # stop anything: the Control Center (after its password) is the only way to turn the project on or off. Reachable only
  # through CloudFront (/control/*), which signs its requests (origin access control).
  # COST: a few invocations a day stay inside the Lambda free tier; logs are kept 14 days. The source is deploy/lambda/control.py
  # and a test keeps this inline copy identical to it.
  AppLogGroup:            # the server's container logs (api, db): kept after Stop, read by the Control Center
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/projects/${ProjectName}/app'
      RetentionInDays: 90                     # COST: a small app stays inside CloudWatch's free tier
      Tags: [{Key: Project, Value: !Ref ProjectName}]
  ControlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-control'
      RetentionInDays: 90
  ControlRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/project-role-boundary'   # see deploy/README.md
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: status-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Sid: Logs, Effect: Allow, Action: ['logs:CreateLogStream', 'logs:PutLogEvents'], Resource: !GetAtt ControlLogGroup.Arn}
              - {Sid: ReadServerState, Effect: Allow, Action: 'ec2:DescribeInstances', Resource: '*'}   # describe cannot be limited to one resource
  ControlFunction:
    Type: AWS::Lambda::Function
    DependsOn: ControlLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-control'
      Runtime: python3.12
      Architectures: [arm64]                  # COST - cheaper per millisecond
      Handler: index.handler
      Role: !GetAtt ControlRole.Arn
      Timeout: 10
      MemorySize: 128                         # COST - the smallest size: it only reads the server's state
      Environment:
        Variables:
          PROJECT: !Ref ProjectName
      Code:
        ZipFile: |
          """AWS-only status function behind CloudFront. It reports the server's state to the page and answers /api/* while the
          project is at zero (no server). It can NOT start or stop anything: the only way to turn the project on or off is the
          Control Center, after its password. Inline in the template (keep under 4096 bytes)."""
          import json, os
          import boto3
          P = os.environ["PROJECT"]
          ec2 = boto3.client("ec2")

          def server_state():
              f = [{"Name": "tag:Project", "Values": [P]}, {"Name": "instance-state-name", "Values": ["pending", "running", "stopping", "stopped"]}]
              for r in ec2.describe_instances(Filters=f)["Reservations"]:
                  for i in r["Instances"]:
                      return i["State"]["Name"]
              return "zero"

          def out(code, body):
              return {"statusCode": code, "headers": {"content-type": "application/json", "cache-control": "no-store"}, "body": json.dumps(body)}

          def handler(event, context):
              raw_path, method = event.get("rawPath", ""), event["requestContext"]["http"]["method"]
              if raw_path.startswith("/api/"):   # routed here only while the project is at zero
                  return out(503, {"detail": "Service offline", "offline": True})
              if method != "GET" or raw_path.rstrip("/").rsplit("/", 1)[-1] != "status":
                  return out(404, {"detail": "Not found. Turn the project on or off from the Control Center."})
              try:
                  st = server_state()
                  return out(200, {"state": st, "on": st in ("pending", "running")})
              except Exception as e:
                  print("status error", type(e).__name__)
                  return out(503, {"detail": "Status is unavailable right now"})

  ControlUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ControlFunction.Arn
      AuthType: AWS_IAM                       # only a signed request gets in: the raw address cannot be called directly
  ControlInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
      FunctionUrlAuthType: AWS_IAM
  ControlInvokePermission:                    # newer function URLs also want this one; harmless otherwise
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ControlFunction
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  ControlOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-control-oac'
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # ------------------------------------------------------------------ power adapter for the Control Center
  # The Control Center (a separate project) invokes this function to take the project to on, off (stopped) or zero
  # (server, disk and IP removed after a database backup). It has no URL: only the Control Center's role can invoke it,
  # and the Control Center checks its own password before every action. To go to zero and back it updates THIS stack's
  # Power parameter with its own permissions (listed below: exactly what that change creates and removes).
  # COST: a few invocations a month; logs kept 14 days. Source: deploy/lambda/power.py (a test keeps this copy identical).
  PowerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-power'
      RetentionInDays: 90
  PowerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/project-role-boundary'   # see deploy/README.md
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: power-levels-for-this-project
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Sid: Logs, Effect: Allow, Action: ['logs:CreateLogStream', 'logs:PutLogEvents'], Resource: !GetAtt PowerLogGroup.Arn}
              - Sid: ThisStackOnly
                Effect: Allow
                Action: ['cloudformation:DescribeStacks', 'cloudformation:UpdateStack']
                Resource: !Ref 'AWS::StackId'
              - Sid: StartStopThisProjectsServer
                Effect: Allow
                Action: ['ec2:StartInstances', 'ec2:StopInstances', 'ec2:TerminateInstances']
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition: {StringEquals: {'aws:ResourceTag/Project': !Ref ProjectName}}
              - Sid: RecreateTheServerAndItsAddress   # what CloudFormation needs to bring the server and its Elastic IP back
                Effect: Allow
                Action: ['ec2:RunInstances', 'ec2:CreateTags', 'ec2:AllocateAddress', 'ec2:ReleaseAddress', 'ec2:AssociateAddress',
                         'ec2:DisassociateAddress', 'ec2:Describe*', 'ec2:ModifyInstanceAttribute']
                Resource: '*'
                Condition: {StringEquals: {'aws:RequestedRegion': !Ref 'AWS::Region'}}
              - Sid: HandTheServerItsRole
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt ServerRole.Arn
              - Sid: RepointTheDistribution
                Effect: Allow
                Action: ['cloudfront:GetDistribution', 'cloudfront:GetDistributionConfig', 'cloudfront:UpdateDistribution',
                         'cloudfront:TagResource', 'cloudfront:ListTagsForResource']
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Sid: ReadWhatTheDistributionRefersTo   # CloudFormation re-reads these while it repoints the distribution
                Effect: Allow
                Action: ['cloudfront:Get*', 'cloudfront:Describe*', 'cloudfront:List*']
                Resource: '*'
              - Sid: ReadTheStacksFunctions        # CloudFormation re-reads every resource the template refers to
                Effect: Allow
                Action: ['lambda:Get*', 'lambda:List*']
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*'
              - Sid: ReadBucketSettingsNotFiles   # bucket-level reads only (the ARNs have no /*): no document is readable
                Effect: Allow
                Action: 's3:Get*'
                Resource: [!GetAtt UiBucket.Arn, !GetAtt DataBucket.Arn, !GetAtt CredsBucket.Arn]
              - {Sid: ReadLogGroups, Effect: Allow, Action: 'logs:DescribeLogGroups', Resource: '*'}   # cannot be narrowed
              - Sid: ReadTheStacksLogGroupTags
                Effect: Allow
                Action: ['logs:ListTagsForResource', 'logs:ListTagsLogGroup']
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-*'
              - Sid: ReadTheStacksRoles
                Effect: Allow
                Action: ['iam:GetRole', 'iam:GetRolePolicy', 'iam:ListRolePolicies', 'iam:ListAttachedRolePolicies',
                         'iam:GetInstanceProfile', 'iam:ListInstanceProfilesForRole']
                Resource: [!Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*',
                           !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${ProjectName}-*']
              - Sid: UseTheDefaultDiskKeyThroughEc2Only   # the new server's encrypted disk (AWS's own aws/ebs key)
                Effect: Allow
                Action: ['kms:CreateGrant', 'kms:Decrypt', 'kms:DescribeKey', 'kms:GenerateDataKeyWithoutPlaintext', 'kms:ReEncrypt*']
                Resource: '*'
                Condition: {StringEquals: {'kms:ViaService': !Sub 'ec2.${AWS::Region}.amazonaws.com'}}
              - !If
                - ScheduleOn
                - Sid: WorkingHoursSchedules
                  Effect: Allow
                  Action: ['scheduler:CreateSchedule', 'scheduler:DeleteSchedule', 'scheduler:GetSchedule', 'scheduler:UpdateSchedule', 'iam:PassRole']
                  Resource: [!Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${ProjectName}-*', !GetAtt SchedulerRole.Arn]
                - !Ref 'AWS::NoValue'
              - Sid: BackUpTheDatabase
                Effect: Allow
                Action: 'ssm:SendCommand'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition: {StringEqualsIfExists: {'aws:ResourceTag/Project': !Ref ProjectName}}
              - {Sid: WatchTheBackup, Effect: Allow, Action: ['ssm:GetCommandInvocation', 'ssm:DescribeInstanceInformation'], Resource: '*'}
              - Sid: RememberTheLastAction
                Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub '${DataBucket.Arn}/control/*'
  PowerFunction:
    Type: AWS::Lambda::Function
    DependsOn: PowerLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-power'      # the Control Center may invoke only functions named *-power
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt PowerRole.Arn
      Timeout: 900                            # going to zero waits for the database backup (a few minutes)
      MemorySize: 128
      Environment:
        Variables:
          PROJECT: !Ref ProjectName
          STACK: !Ref 'AWS::StackName'
          DATA_BUCKET: !Ref DataBucket
      Code:
        ZipFile: |
          """Control Center power adapter (status|on|off|zero). Only the Control Center may invoke it (IAM)."""
          import json, os, time
          import boto3
          P, S, D, K = os.environ["PROJECT"], os.environ["STACK"], os.environ["DATA_BUCKET"], "control/power.json"
          ec2, cfn, ssm, s3 = (boto3.client(n) for n in ("ec2", "cloudformation", "ssm", "s3"))
          LV = {"running": "running", "pending": "starting", "stopping": "stopping", "stopped": "stopped"}

          def server():
              f = [{"Name": "tag:Project", "Values": [P]}, {"Name": "instance-state-name", "Values": list(LV)}]
              for r in ec2.describe_instances(Filters=f)["Reservations"]:
                  for i in r["Instances"]:
                      return i["InstanceId"], i["State"]["Name"]
              return None, None

          def stack():
              s = cfn.describe_stacks(StackName=S)["Stacks"][0]
              return s["StackStatus"], {p["ParameterKey"]: p.get("ParameterValue") for p in s.get("Parameters", [])}

          def note(**d):
              s3.put_object(Bucket=D, Key=K, Body=json.dumps(dict(d, at=time.time())).encode(), ServerSideEncryption="AES256")

          def status():
              st, ps = stack()
              try: n = json.loads(s3.get_object(Bucket=D, Key=K)["Body"].read())
              except Exception: n = {}
              z, age = ps.get("Power") == "zero", time.time() - n.get("at", 0)
              if st.endswith("_IN_PROGRESS"):
                  return {"level": "changing", "detail": "Going %s (%s)" % ("to zero" if z else "on", st)}
              if n.get("phase") == "backup" and age < 1500:
                  return {"level": "changing", "detail": "Backing up the database"}
              err = n.get("error", "") if age < 86400 else ""
              if z:
                  return {"level": "zero", "detail": err or "Data kept in S3"}
              return {"level": LV.get(server()[1], "unknown"), "detail": err}

          def power(v):
              pp = [{"ParameterKey": k, "UsePreviousValue": True} for k in stack()[1] if k != "Power"]
              cfn.update_stack(StackName=S, UsePreviousTemplate=True, Capabilities=["CAPABILITY_IAM"],
                               Parameters=pp + [{"ParameterKey": "Power", "ParameterValue": v}])

          def wait(ok, secs):
              end = time.time() + secs
              while time.time() < end:
                  if ok():
                      return True
                  time.sleep(10)

          def backup(i, s):
              if s == "stopped":
                  ec2.start_instances(InstanceIds=[i])
              up = lambda: any(x["PingStatus"] == "Online" for x in ssm.describe_instance_information(
                  Filters=[{"Key": "InstanceIds", "Values": [i]}])["InstanceInformationList"])
              if not wait(up, 420):
                  raise RuntimeError("server not online for backup")
              c = ssm.send_command(InstanceIds=[i], DocumentName="AWS-RunShellScript",
                                   Parameters={"commands": ["/opt/app/backup.sh"]})["Command"]["CommandId"]
              r = {}
              def done():
                  try: r.update(ssm.get_command_invocation(CommandId=c, InstanceId=i))
                  except Exception: return False
                  return r["Status"] not in ("Pending", "InProgress", "Delayed")
              wait(done, 600)
              if r.get("Status") != "Success":
                  raise RuntimeError("backup failed (%s)" % r.get("Status", "timeout"))

          def handler(event, context):
              a = (event or {}).get("action")
              try:
                  if a == "status":
                      return status()
                  st, ps = stack()
                  z, (i, s) = ps.get("Power") == "zero", server()
                  if a not in ("on", "off", "zero"):
                      return {"ok": False, "detail": "Unknown action"}
                  if st.endswith("_IN_PROGRESS") or (s in ("pending", "stopping") and not z):
                      return {"ok": False, "detail": "Busy, try again in a minute"}
                  if a == "on" and z:
                      note(phase="rebuild")
                      power("on")
                  elif a == "on" and s == "stopped":
                      ec2.start_instances(InstanceIds=[i])
                  elif a == "off" and s == "running":
                      ec2.stop_instances(InstanceIds=[i])
                  elif a == "zero" and not z:
                      note(phase="backup")
                      backup(i, s)
                      note(phase="remove")
                      power("zero")
                  return dict(status(), ok=True)
              except Exception as e:
                  print("power error", e)
                  note(phase="failed", error="Last action failed: %s" % e)
                  return {"ok": False, "detail": str(e)}

  # ------------------------------------------------------------------ optional: working-hours schedule
  PowerNeverRetries:      # a Stop or Turn on that fails or times out is never retried later on its own
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref PowerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60           # a background request older than a minute is dropped, never run late
  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleOn
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/project-role-boundary'   # see deploy/README.md
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: scheduler.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: start-stop-this-server-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ec2:StartInstances', 'ec2:StopInstances']
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition: {StringEquals: {'aws:ResourceTag/Project': !Ref ProjectName}}
  StartSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleActive
    Properties:
      Name: !Sub '${ProjectName}-start'
      ScheduleExpression: !Sub 'cron(0 ${StartHour} ? * MON-FRI *)'
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: 'arn:aws:scheduler:::aws-sdk:ec2:startInstances'
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${Server}"]}'
  StopSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleActive
    Properties:
      Name: !Sub '${ProjectName}-stop'
      ScheduleExpression: !Sub 'cron(0 ${StopHour} ? * MON-FRI *)'
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: 'arn:aws:scheduler:::aws-sdk:ec2:stopInstances'
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Sub '{"InstanceIds":["${Server}"]}'

  # ------------------------------------------------------------------ optional: budget alert (the first two budgets in an account are free)
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub '${ProjectName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref BudgetLimitUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  LogSources:
    Description: Where the Control Center reads this project's logs (service name -> log group; app streams are named after the container).
    Value: !Sub '[{"service":"app","group":"/projects/${ProjectName}/app"},{"service":"power","group":"/aws/lambda/${ProjectName}-power"},{"service":"status","group":"/aws/lambda/${ProjectName}-control"}]'
  TemplateVersion:
    Description: The commit the stored template came from.
    Value: !Ref TemplateVersion
  SiteAtZero:
    Description: What the site address does while the project is at zero (Power=zero).
    Value: Distribution disabled - nothing answers; only the Control Center is reachable
  SiteUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  UiBucketName:
    Value: !Ref UiBucket
  DataBucketName:
    Value: !Ref DataBucket
  CredentialsBucketName:
    Value: !Ref CredsBucket
  ControlFunctionName:
    Value: !Ref ControlFunction
  InstanceId:
    Condition: PowerOn
    Value: !Ref Server
  PowerFunctionName:
    Description: Register this with the Control Center (python deploy/cc.py register in the control-center project).
    Value: !Ref PowerFunction
  DistributionId:
    Value: !Ref Distribution
